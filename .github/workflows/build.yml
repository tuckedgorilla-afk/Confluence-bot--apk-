name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK using Official Kivy Docker Image
        run: |
          docker run --rm \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -e APP_ANDROID_ACCEPT_SDK_LICENSES=True \
            -v ${{ github.workspace }}:/home/user/hostpython \
            kivy/buildozer \
            buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfluenceEngine-APK
          path: bin/*.apk
